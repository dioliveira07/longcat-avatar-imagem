name: build
on: { push: { branches: [main], paths-ignore: ["remotion/**", ".github/workflows/remotion.yml", "infinitetalk/**", ".github/workflows/infinitetalk.yml"] }, workflow_dispatch: {} }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost && sudo docker image prune -af && df -h /
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/dioliveira07/longcat-avatar:1.6,ghcr.io/dioliveira07/longcat-avatar:latest" }
